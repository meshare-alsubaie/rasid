name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # undici 8 needs Node 22. See collect.yml for the failure it causes.
          node-version: 22
          cache: npm

      - run: npm ci

      # Types and schemas must agree before the data is judged.
      - run: npm run typecheck

      # Fails on any honesty violation: a value without provenance, a published
      # rule without its wording, a graduate-development record shown as open.
      - run: npm run validate

      # The rules that guard the two things a null must never become: a zero,
      # and a notification.
      - run: npm run test:classifier
      - run: npm run test:notify

      # The repository is public. The README called this a gate before it was
      # one: it was a habit someone had to remember, run by hand, with nothing
      # stopping a commit that carried a key or a person's details.
      - run: npm run audit:privacy

      # Acceptance criteria 8.7 are measured, not asserted: contrast on every
      # theme, and the Lighthouse bars the spec names. Both need a browser and a
      # real build, so they run last.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit:contrast
      - run: npm run audit:lighthouse
