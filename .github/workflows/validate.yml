name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Types and schemas must agree before the data is judged.
      - run: npm run typecheck

      # Fails on any honesty violation: a value without provenance, a published
      # rule without its wording, a graduate-development record shown as open.
      - run: npm run validate
